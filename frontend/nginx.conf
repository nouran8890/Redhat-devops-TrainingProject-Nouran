server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /api/auth {
        proxy_pass http://auth-service-container:8082;
    }

    location /api/auth/ {
        proxy_pass http://auth-service-container:8082;
    }

    location = /api/catalog {
        proxy_pass http://catalog-service-container:8081;
    }

    location /api/catalog/ {
        proxy_pass http://catalog-service-container:8081;
    }

    location = /api/bookings {
        proxy_pass http://booking-service-container:8083;
    }

    location /api/bookings/ {
        proxy_pass http://booking-service-container:8083;
    }

    location = /api/reviews {
        proxy_pass http://booking-service-container:8083;
    }

    location /api/reviews/ {
        proxy_pass http://booking-service-container:8083;
    }

    location = /api/analyze {
        proxy_pass http://ai-insight-service-container:8084;
    }

    location /api/analyze/ {
        proxy_pass http://ai-insight-service-container:8084;
    }

    location = /api/analytics {
        proxy_pass http://analytics-service-container:8085;
    }

    location /api/analytics/ {
        proxy_pass http://analytics-service-container:8085;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}